[project]
name = "university-connector"
version = "0.1.0"
description = "Connect your university LMS (Brightspace, Canvas) to AI agents like Muse, dots, and Grok Bot over MCP."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "cryptography>=44",
    "fastapi>=0.115",
    "fastmcp>=2.12",
    "httpx>=0.27",
    "keyring>=25",
    "playwright>=1.48",
    "pydantic>=2.7",
    "uvicorn>=0.30",
]

[project.scripts]
university-connector = "university_connector.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/university_connector"]

[tool.hatch.build.targets.wheel.force-include]
"universities" = "university_connector/presets"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["tests"]
